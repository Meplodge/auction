{% extends "base.html" %}

{% block title %}Page not found — Auction System{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center" style="padding:7rem 0">
            <span class="overline overline-accent mb-3">Error 404</span>
            <h1 class="display mb-3">Lot withdrawn.</h1>
            <p class="lede mb-4">
                The page you asked for isn't here. It may have been removed,
                or the address may be mistyped.
            </p>
            <div class="d-flex flex-wrap gap-3 justify-content-center">
                <a href="{{ url_for('index') }}" class="btn btn-primary">Return home</a>
                <a href="{{ url_for('search') }}" class="btn btn-outline">Browse lots</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
