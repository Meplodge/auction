{% extends "base.html" %}

{% block title %}Server error — Auction House{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center" style="padding:7rem 0">
            <span class="overline overline-accent mb-3">Error 500</span>
            <h1 class="display mb-3">Bidding paused.</h1>
            <p class="lede mb-4">
                Something failed on our side. Nothing you did caused it —
                please try again in a moment.
            </p>
            <div class="d-flex flex-wrap gap-3 justify-content-center">
                <a href="{{ url_for('index') }}" class="btn btn-primary">Return home</a>
                <button type="button" class="btn btn-outline" onclick="window.location.reload()">Try again</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
